name: modules

on:
  push:
    branches: '**'
  pull_request:
    branches: main

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout contents
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
          cache: 'pip'

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/
